<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Stratos Memory Stack</title>
<style>
  :root {
    --mint: #7FFFB0;
    --mint-strong: #5BFF9A;
    --mint-soft: rgba(127, 255, 176, 0.14);
    --mint-glow: rgba(127, 255, 176, 0.32);
    --mint-ink: #062B14;
    --gold: #CDB06A;
    --bg-page: #050709;
    --bg-stage: #0B0F12;
    --bg-card: #11171B;
    --fg: #F2F5F4;
    --fg-soft: rgba(242, 245, 244, 0.72);
    --fg-mute: rgba(242, 245, 244, 0.48);
    --line-strong: rgba(255, 255, 255, 0.16);
  }
  @font-face {
    font-family: 'Geist';
    src: local('Geist'), local('Inter');
    font-display: swap;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1280px;
    height: 640px;
    background: var(--bg-page);
    color: var(--fg);
    font-family: 'Geist', 'Inter', system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 1280px;
    height: 640px;
    padding: 72px 96px;
    background:
      radial-gradient(900px 500px at 85% 110%, rgba(127, 255, 176, 0.18), transparent 60%),
      radial-gradient(700px 400px at 10% -10%, rgba(205, 176, 106, 0.10), transparent 60%),
      linear-gradient(180deg, #06090B 0%, #050709 100%);
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header"
      "title  logo"
      "footer footer";
    column-gap: 64px;
    row-gap: 32px;
  }
  .grid-noise {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(127,255,176,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(127,255,176,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
  }
  .header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 2;
  }
  .header .brand-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 16px var(--mint-glow);
  }
  .header .brand-name {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fg-soft);
  }
  .title {
    grid-area: title;
    align-self: end;
    position: relative;
    z-index: 2;
  }
  .title .eyebrow {
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mint);
    margin-bottom: 16px;
    opacity: 0.85;
  }
  .title h1 {
    font-size: 96px;
    line-height: 1.0;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--fg);
    margin-bottom: 24px;
  }
  .title h1 .grad {
    background: linear-gradient(135deg, var(--mint) 0%, var(--mint-strong) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title .tag {
    font-size: 26px;
    color: var(--fg-soft);
    max-width: 720px;
    line-height: 1.35;
  }
  .logo {
    grid-area: logo;
    align-self: center;
    justify-self: end;
    width: 280px;
    height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .logo .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(127, 255, 176, 0.22), transparent 70%);
    filter: blur(8px);
  }
  .logo img {
    width: 220px;
    height: 220px;
    object-fit: contain;
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 12px 40px rgba(127, 255, 176, 0.35));
  }
  .footer {
    grid-area: footer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--line-strong);
    padding-top: 28px;
    position: relative;
    z-index: 2;
  }
  .footer .chips {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 16px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    color: var(--fg-soft);
    background: rgba(255,255,255,0.02);
    letter-spacing: 0.02em;
  }
  .chip.accent {
    border-color: rgba(127,255,176,0.35);
    color: var(--mint);
    background: var(--mint-soft);
  }
  .footer .by {
    font-size: 18px;
    color: var(--fg-mute);
    letter-spacing: 0.04em;
  }
  .footer .by strong {
    color: var(--fg-soft);
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="grid-noise"></div>

  <div class="header">
    <div class="brand-dot"></div>
    <div class="brand-name">Stratos House AI</div>
  </div>

  <div class="title">
    <div class="eyebrow">Free for Claude Code</div>
    <h1>Stratos<br/><span class="grad">Memory Stack</span></h1>
    <div class="tag">Six layers that give Claude real memory across sessions. Drop in, audit, install what's missing.</div>
  </div>

  <div class="logo">
    <div class="ring"></div>
    <img src="logo.png" alt="Stratos logo" />
  </div>

  <div class="footer">
    <div class="chips">
      <span class="chip accent">claude-mem</span>
      <span class="chip">basic-memory</span>
      <span class="chip">Obsidian</span>
      <span class="chip">Pinecone</span>
      <span class="chip">CLAUDE.md</span>
      <span class="chip">STATE.md</span>
    </div>
    <div class="by">by <strong>stratosagency.ai</strong></div>
  </div>
</div>
</body>
</html>
